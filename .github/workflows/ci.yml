name: Legacy SafeCam CI

on:
  push:
    paths:
      - "legacy-safecam/**"
  pull_request:
    paths:
      - "legacy-safecam/**"

jobs:
  legacy-safecam-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r legacy-safecam/backend/requirements.txt
      - name: Run backend tests
        run: PYTHONPATH=legacy-safecam/backend pytest legacy-safecam/backend/tests

  legacy-safecam-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: legacy-safecam/frontend
        run: |
          npm install
          npm run build
